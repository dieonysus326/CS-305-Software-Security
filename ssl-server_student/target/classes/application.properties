## HTTPS configuration for the Artemis Financial SSL server.
## The keystore holds the self-signed certificate generated with the Java Keytool.

server.port=8443
server.ssl.enabled=true
server.ssl.key-alias=tomcat
server.ssl.key-store-password=Art3misF1nancial
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12

## Only allow current TLS versions. SSLv3, TLS 1.0, and TLS 1.1 are deprecated.
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
